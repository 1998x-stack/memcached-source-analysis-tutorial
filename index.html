<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>课程目录</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f9fcf5 0%, #e8f3e8 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            display: block;
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(2px);
            border-radius: 48px 48px 32px 32px;
            padding: 2rem 2rem 1.5rem;
            box-shadow: 0 20px 40px rgba(90, 140, 100, 0.15), 0 8px 20px rgba(0, 30, 20, 0.08);
            border: 1px solid rgba(255, 245, 200, 0.5);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 2rem;
            border-bottom: 4px solid #f7d44a;
            padding-bottom: 0.75rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #2b7a4b, #3f9e6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(60, 140, 80, 0.12);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 .emoji {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 4px rgba(255, 200, 50, 0.3));
        }

        .header .sub {
            font-size: 1rem;
            background: #fef7e0;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            color: #3f6b4a;
            font-weight: 600;
            border: 1px solid #f3d98a;
            box-shadow: 0 2px 6px rgba(200, 160, 50, 0.1);
            white-space: nowrap;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
            margin: 1.8rem 0 1.2rem;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 1rem 1.2rem 1rem 1.2rem;
            box-shadow: 0 6px 14px rgba(70, 120, 80, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            border: 1px solid rgba(210, 230, 200, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 24px rgba(70, 140, 90, 0.15), 0 4px 12px rgba(40, 100, 60, 0.05);
            border-color: #b8d9b0;
            background: #fefefc;
        }

        .card-header {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            margin-bottom: 0.4rem;
            flex-wrap: wrap;
        }

        .chapter-num {
            font-size: 1.1rem;
            font-weight: 700;
            background: #f5d142;
            color: #2a5a3a;
            padding: 0 0.6rem;
            border-radius: 40px;
            line-height: 1.6;
            display: inline-block;
            box-shadow: inset 0 -2px 0 #dbb42c;
            letter-spacing: 0.3px;
            min-width: 2.2rem;
            text-align: center;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 650;
            color: #1f4d33;
            letter-spacing: -0.3px;
            line-height: 1.3;
            flex: 1;
        }

        .topic-list {
            list-style: none;
            margin-top: 0.3rem;
            padding-left: 0.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.6rem;
        }

        .topic-list li {
            font-size: 0.8rem;
            color: #2d543a;
            background: #f1f9ee;
            padding: 0.1rem 0.7rem 0.2rem 1.2rem;
            border-radius: 30px;
            line-height: 1.6;
            position: relative;
            border: 1px solid #dcebd4;
            box-shadow: inset 0 1px 2px white;
        }

        .topic-list li::before {
            content: "⚡";
            position: absolute;
            left: 4px;
            top: 0px;
            font-size: 0.7rem;
            color: #e5b13b;
        }

        .card-footer {
            margin-top: 0.6rem;
            display: flex;
            justify-content: flex-end;
            border-top: 1px dashed #d4e8d0;
            padding-top: 0.5rem;
        }

        .card-footer a {
            background: #b7d8b0;
            color: #1f452b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            transition: 0.15s;
            border: 1px solid #8fb88a;
            box-shadow: 0 2px 4px rgba(60, 120, 60, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .card-footer a::after {
            content: "→";
            font-size: 1rem;
            transition: transform 0.1s;
        }

        .card-footer a:hover {
            background: #f7d44a;
            border-color: #dbb42c;
            color: #1f3d28;
            box-shadow: 0 4px 8px rgba(200, 160, 40, 0.2);
            transform: scale(1.02);
        }

        .card-footer a:active {
            transform: scale(0.96);
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 1rem;
            color: #3b6b47;
            background: #f2fcee;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid #c6dfbe;
            box-shadow: 0 2px 8px rgba(80, 130, 70, 0.08);
            font-weight: 500;
            letter-spacing: 0.3px;
            backdrop-filter: blur(2px);
        }

        .footer span {
            background: #f9eec1;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            margin: 0 4px;
        }

        .footer .wechat {
            font-weight: 700;
            color: #1f5a33;
        }

        @media (max-width: 640px) {
            body { padding: 1rem 0.8rem; }
            .container { padding: 1.2rem 1rem; border-radius: 32px; }
            .header h1 { font-size: 1.8rem; }
            .header .sub { font-size: 0.75rem; padding: 0.2rem 0.8rem; }
            .course-grid { grid-template-columns: 1fr; gap: 1rem; }
            .card-title { font-size: 1.05rem; }
            .topic-list li { font-size: 0.7rem; }
        }

        @media (min-width: 768px) and (max-width: 1024px) {
            .course-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .container::before {
            content: "";
            display: block;
            height: 6px;
            width: 120px;
            background: linear-gradient(90deg, #f7d44a, #7fc47c, #4aa0b0, #f7b07a);
            border-radius: 10px;
            margin-bottom: 0.2rem;
        }

        /* Alternate chapter badge colors */
        .card:nth-child(6n+1) .chapter-num { background: #f7b07a; color: #3d2e1a; }
        .card:nth-child(6n+2) .chapter-num { background: #a7d4a0; color: #1f452b; }
        .card:nth-child(6n+3) .chapter-num { background: #f5d44a; color: #2f4d2a; }
        .card:nth-child(6n+4) .chapter-num { background: #b3d9e8; color: #1a3f4a; }
        .card:nth-child(6n+5) .chapter-num { background: #f7c6c6; color: #5a2e2e; }
        .card:nth-child(6n) .chapter-num { background: #c4b3e0; color: #2f2a4a; }

        .state-msg {
            text-align: center;
            padding: 3rem;
            color: #5f7f66;
            font-size: 1.1rem;
        }
        .state-msg.error {
            color: #b91c1c;
            background: #fef2f2;
            border-radius: 20px;
            margin: 1rem 0;
        }

        /* === 课程地图 / 图示（内联，保证离线渲染且窄屏不溢出） === */
        .quick-nav {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            margin-bottom: 1.2rem;
        }
        .quick-nav a {
            font-size: 0.82rem; font-weight: 600; text-decoration: none;
            color: #1e40af; background: #eef4ff; border: 1px solid #c7d8f5;
            border-radius: 30px; padding: 0.25rem 0.9rem; transition: 0.15s;
        }
        .quick-nav a:hover { background: #dbe8ff; transform: translateY(-1px); }
        .quick-nav a:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
        .lede { font-size: 1.02rem; color: #334155; line-height: 1.85; }
        figure.diagram {
            margin: 1.4rem 0; padding: 1rem 1.1rem; background: #f8fafc;
            border: 1px solid #dbe3ec; border-radius: 20px; overflow-x: auto;
        }
        figure.diagram svg { display: block; width: 100%; height: auto; min-width: 560px; }
        figure.diagram figcaption {
            margin-top: 0.7rem; font-size: 0.88rem; color: #475569; line-height: 1.65;
        }
        figure.diagram figcaption strong { color: #0f172a; }
        main { display: block; }
        pre { overflow-x: auto; max-width: 100%; }
        @media (max-width: 640px) {
            .main-content, main { padding: 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <nav class="quick-nav" aria-label="页面导航">
        <a href="#course-map">课程地图</a>
        <a href="#course-list">全部章节</a>
        <a href="#how-to">阅读建议</a>
    </nav>

    <div class="header">
        <h1><span class="emoji">⚙️</span><span class="title-text">Memcached 源码分析</span></h1>
        <div class="sub">28 章 · 实战体系</div>
    </div>

    <main>
    <h2 id="course-map">课程地图：从入门到内核</h2>
    <p class="lede">这 28 章不是平铺的知识点，而是一条有依赖关系的学习路径：先把 Memcached 跑起来、看清目录骨架，再逐层钻进内存管理、网络并发与协议三条主线，最后用一个大作业把 slab + hash + LRU 串起来。下图给出六个阶段的顺序与章节区间，可作为你规划节奏的地图。</p>
    <figure class="diagram" id="hero-diagram">
      <svg viewBox="0 0 860 500" role="img" aria-labelledby="mapTitle mapDesc" xmlns="http://www.w3.org/2000/svg">
        <title id="mapTitle">Memcached 源码课程地图</title>
        <desc id="mapDesc">六个学习阶段按依赖顺序自上而下排列，从入门准备到综合项目，右侧标注对应章节区间。</desc>
        <line x1="46" y1="70" x2="46" y2="430" stroke="#cbd5e1" stroke-width="3"/>
        <text x="70" y="28" font-size="19" font-weight="700" fill="#0f172a">由表象 → 内核：六个阶段</text>
        <g>
          <circle cx="46" cy="70" r="12" fill="#38bdf8"/><text x="46" y="75" font-size="13" text-anchor="middle" fill="#fff">1</text>
          <rect x="74" y="40" width="760" height="60" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
          <text x="94" y="68" font-size="20" font-weight="700" fill="#0c4a6e">入门准备</text>
          <text x="94" y="90" font-size="14" fill="#0369a1">环境搭建 · 源码获取 · 目录全景</text>
          <text x="814" y="76" font-size="15" text-anchor="end" fill="#0369a1">第 01–03 章</text>
        </g>
        <g>
          <circle cx="46" cy="142" r="12" fill="#4ade80"/><text x="46" y="147" font-size="13" text-anchor="middle" fill="#fff">2</text>
          <rect x="74" y="112" width="760" height="60" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
          <text x="94" y="140" font-size="20" font-weight="700" fill="#14532d">启动与配置</text>
          <text x="94" y="162" font-size="14" fill="#166534">main 逐行 · settings · 日志与统计</text>
          <text x="814" y="148" font-size="15" text-anchor="end" fill="#166534">第 04–06 章</text>
        </g>
        <g>
          <circle cx="46" cy="214" r="12" fill="#facc15"/><text x="46" y="219" font-size="13" text-anchor="middle" fill="#fff">3</text>
          <rect x="74" y="184" width="760" height="60" rx="14" fill="#fef9c3" stroke="#facc15" stroke-width="2"/>
          <text x="94" y="212" font-size="20" font-weight="700" fill="#713f12">内存管理核心 ★</text>
          <text x="94" y="234" font-size="14" fill="#854d0e">slab · item · LRU · 哈希表与 rehash</text>
          <text x="814" y="220" font-size="15" text-anchor="end" fill="#854d0e">第 07–14 章</text>
        </g>
        <g>
          <circle cx="46" cy="286" r="12" fill="#fb7185"/><text x="46" y="291" font-size="13" text-anchor="middle" fill="#fff">4</text>
          <rect x="74" y="256" width="760" height="60" rx="14" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/>
          <text x="94" y="284" font-size="20" font-weight="700" fill="#881337">网络与并发</text>
          <text x="94" y="306" font-size="14" fill="#9f1239">libevent · 连接状态机 · 多线程与锁</text>
          <text x="814" y="292" font-size="15" text-anchor="end" fill="#9f1239">第 15–18 章</text>
        </g>
        <g>
          <circle cx="46" cy="358" r="12" fill="#a78bfa"/><text x="46" y="363" font-size="13" text-anchor="middle" fill="#fff">5</text>
          <rect x="74" y="328" width="760" height="60" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
          <text x="94" y="356" font-size="20" font-weight="700" fill="#4c1d95">协议与扩展</text>
          <text x="94" y="378" font-size="14" fill="#5b21b6">ASCII/Binary/Meta · 混合存储 · Proxy</text>
          <text x="814" y="364" font-size="15" text-anchor="end" fill="#5b21b6">第 19–23 章</text>
        </g>
        <g>
          <circle cx="46" cy="430" r="12" fill="#94a3b8"/><text x="46" y="435" font-size="13" text-anchor="middle" fill="#fff">6</text>
          <rect x="74" y="400" width="760" height="60" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
          <text x="94" y="428" font-size="20" font-weight="700" fill="#334155">工程实践与综合</text>
          <text x="94" y="450" font-size="14" fill="#475569">测试 · 调优 · 对比 · 手写 Mini-Memcached</text>
          <text x="814" y="436" font-size="15" text-anchor="end" fill="#475569">第 24–28 章</text>
        </g>
      </svg>
      <figcaption><strong>图 0-1　课程地图。</strong>六个阶段存在明确依赖：内存管理主线（第 3 阶段，★）是后续网络、协议与综合项目的地基，建议不要跳读。章节区间为课程编排，不代表 Memcached 官方文档结构。</figcaption>

    <h2 id="course-list">全部章节</h2>
    <p class="lede">点击任意卡片进入对应章节。每章都可离线打开，正文含可直接对照源码阅读的图示与实验说明。</p>
    <div id="cardContainer" class="course-grid"></div>

    <h2 id="how-to">阅读建议</h2>
    <p class="lede">入门阶段（01–06 章）建议一次读完，用一两天建立全局认知；<strong>内存管理主线（07–14 章）是全书核心</strong>，slab allocator、item、LRU、哈希表环环相扣，建议按顺序每周 2 章、配合动手实验推进；网络并发（15–18 章）与协议扩展（19–23 章）可并行推进；最后的综合项目（24–28 章）建议在三周内完成，用来检验前面所有机制的掌握程度。</p>
    <p class="lede">阅读时不必追求记住每一行代码，重在理解<strong>设计取舍</strong>：为什么用 slab 而不是 malloc、为什么哈希表要渐进式 rehash、为什么 LRU 要分三级。带着这些问题读，收获会远大于逐行背诵。</p>
    </main>

    <div style="text-align:center;">
        <div class="footer"></div>
    </div>
</div>

<script>
    (function() {
        var container = document.getElementById('cardContainer');
        var emojiEl = document.querySelector('.header .emoji');
        var titleEl = document.querySelector('.header .title-text');
        var subEl = document.querySelector('.header .sub');
        var footerEl = document.querySelector('.footer');

        function showError(msg) {
            container.innerHTML = '<div class="state-msg error">' + msg + '</div>';
        }

        fetch('courses.json')
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function(data) {
                document.title = data.title + ' · 课程目录';
                emojiEl.textContent = data.emoji;
                titleEl.textContent = data.title;
                subEl.textContent = data.subtitle;
                footerEl.innerHTML = '<span>' + data.chapterCount + '章</span> 实战体系 · 从入门到精通';

                if (!data.chapters || data.chapters.length === 0) {
                    showError('暂无课程数据');
                    return;
                }

                container.innerHTML = '';
                data.chapters.forEach(function(course) {
                    var card = document.createElement('div');
                    card.className = 'card';

                    var headerDiv = document.createElement('div');
                    headerDiv.className = 'card-header';

                    var numSpan = document.createElement('span');
                    numSpan.className = 'chapter-num';
                    numSpan.textContent = course.num;

                    var titleSpan = document.createElement('span');
                    titleSpan.className = 'card-title';
                    titleSpan.textContent = course.title;

                    headerDiv.appendChild(numSpan);
                    headerDiv.appendChild(titleSpan);
                    card.appendChild(headerDiv);

                    if (course.topics && course.topics.length > 0) {
                        var topicUl = document.createElement('ul');
                        topicUl.className = 'topic-list';
                        course.topics.forEach(function(topic) {
                            var li = document.createElement('li');
                            li.textContent = topic;
                            topicUl.appendChild(li);
                        });
                        card.appendChild(topicUl);
                    }

                    var footerDiv = document.createElement('div');
                    footerDiv.className = 'card-footer';
                    var link = document.createElement('a');
                    link.href = course.file;
                    link.textContent = '开始学习 ';
                    footerDiv.appendChild(link);
                    card.appendChild(footerDiv);

                    container.appendChild(card);
                });
            })
            .catch(function(err) {
                showError('课程数据加载失败: ' + err.message + '。请刷新页面重试。');
            });
    })();
</script>

<noscript>
    <div style="background:#fcf0d9; padding:1rem; border-radius:20px; text-align:center; color:#92400e;">
        请启用 JavaScript 以浏览课程目录。
    </div>
</noscript>
</body>
</html>
